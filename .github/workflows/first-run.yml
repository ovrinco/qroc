name: Build and first run
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  first-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.94.0
      - name: System prerequisites
        run: |
          if ! (command -v cc && command -v pkg-config && command -v ffmpeg); then
            sudo timeout 180 apt-get update
            sudo timeout 180 apt-get install -y build-essential pkg-config libsqlite3-dev ffmpeg
          fi
      - name: Build and exercise
        env:
          CARGO_BUILD_JOBS: 2
          QROC_TEST_ROOT: ${{ runner.temp }}/qroc-tests
        run: |
          cargo build --locked --bin qroc-bridge
          cargo test --locked --lib
          cargo test --locked --test t01-bridge
