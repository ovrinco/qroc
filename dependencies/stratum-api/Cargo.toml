[package]
name = "stratum-api"
version = "0.1.0"
edition = "2024"
description = "The shared API layer of the stack: one key store, one price table, a spend guard with a cap per tool, one ledger."
publish = false
license = "Apache-2.0"

[lib]
name = "stratum_api"
path = "src/lib.rs"

[[bin]]
name = "stratum-api"
path = "src/bin/stratum-api.rs"

[[bin]]
name = "stratum-keysvc"
path = "src/bin/stratum-keysvc.rs"

[dependencies]
aes-gcm = "=0.10.3"
getrandom = "=0.2.17"
zeroize = "=1.8.2"
serde_json = "=1.0.145"
thiserror = "=2.0.17"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"
